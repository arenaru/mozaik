ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Hard cap on request body (5 MB image + form fields).
    LimitRequestBody 6291456

    # Project root (config/, src/, templates/, ...) is NOT web accessible.
    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options None
        # .htaccess files are ignored here; all rules live in this vhost.
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Uploaded files: static images only, never executed.
    <Directory /var/www/html/public/uploads>
        Options None
        AllowOverride None
        php_admin_flag engine off
        SetHandler none
        RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .pht
        Require all denied
        <FilesMatch "^[a-f0-9]{32}\.(jpg|png|webp)$">
            Require all granted
        </FilesMatch>
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
        Header always set Content-Disposition "inline"
    </Directory>

    # Security headers for every response (PHP sets them too; "set" replaces duplicates).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
