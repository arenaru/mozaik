ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# Deny access to everything on the filesystem by default.
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

# Never serve dotfiles (.htaccess, .git, .env, ...).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
